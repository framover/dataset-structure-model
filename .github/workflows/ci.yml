name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-schema:
    name: Validate schema and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run test suite
        run: pytest tests/ -v

      - name: Run conformance cases against the Python reader
        run: dsm conformance -v

  matlab-reader:
    name: MATLAB reader tests and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Run the MATLAB suite (unit tests and every conformance case)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("src/matlab"); runMatlabTests();
